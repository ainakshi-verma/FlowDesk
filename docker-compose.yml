version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flowdesk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flowdesk_db
    ports:
      - "5432:5432"
    volumes:
      - flowdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowdesk_pgdata:
